{% extends "base.html" %}
{% block head %}<title>{{ page.title }} · {{ site.title }}</title>{% endblock %}
{% block content %}
<article>
<h1>{{ page.title }}</h1>
{% if page.date %}<time datetime="{{ page.date | date }}">{{ page.date | date }}</time>{% endif %}
{{ content | safe }}
</article>
{% endblock %}
